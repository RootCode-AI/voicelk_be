# Azure and most container hosts pass the port to listen on through PORT.
server.port=${PORT:8082}

# Deployed behind a proxy (Azure ingress, or nginx on the same machine). Tomcat then takes
# the client address and https scheme from X-Forwarded-For / X-Forwarded-Proto, but only
# when the request arrives from an internal proxy address, so clients cannot spoof them.
# If guests all show up with one internal address after deploying, widen the trusted range
# with SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES (a regular expression).
server.forward-headers-strategy=native
spring.application.name=voicelk_be

# Load .env file as properties
spring.config.import=optional:file:.env[.properties]

# Supabase Datasource Configuration
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP). Default max-lifetime is 30 min; a pooled connection is
# retired and replaced after this long. Keep it below any limit the database or the
# Supabase pooler enforces — if the log says "consider using a shorter maxLifetime",
# lower it again. Override with DB_MAX_LIFETIME_MS without editing this file.
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:36000}
# Ping idle connections every 5 min so the pooler or network does not drop them silently.
spring.datasource.hikari.keepalive-time=300000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson Configuration
spring.jackson.deserialization.fail-on-null-for-primitives=false

# JWT Configuration
# HMAC-SHA256 key, at least 32 characters. Never commit it; set JWT_SECRET instead.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-3.1-flash-lite
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api.max-tokens=800

# Firebase Configuration
# Service account, either as the JSON itself (raw or base64) in FIREBASE_CREDENTIALS_JSON,
# which suits a cloud secret, or as a resource path such as file:/mnt/secrets/firebase.json.
firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}
firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}

# Browser origins allowed to call the API, comma separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://chat.voicelk.dev,http://localhost:5173}

# Supabase Storage Configuration
supabase.storage.url=${SUPABASE_URL}
supabase.storage.key=${SUPABASE_KEY}

# TTS Bridge (Python microservice that owns the acoustic model)
tts.bridge.url=${TTS_BRIDGE_URL:http://127.0.0.1:8000}
tts.bridge.api-key=${TTS_BRIDGE_API_KEY:}
tts.bridge.connect-timeout-ms=5000
# Synthesis is slow on CPU and the first call also loads the checkpoint.
tts.bridge.read-timeout-ms=180000

# Which model the backend asks for when the caller does not choose one.
# Leave empty to accept whatever the bridge has configured as its default.
tts.default-model=speaker_03
tts.default-speaker-id=0

# Voices users can pick in the client. Each available key must be a model key registered
# in the TTS bridge; name, description and the optional tag badge are what the client
# shows, in this order. A request for any other voice is refused. status is AVAILABLE
# (the default), COMING_SOON (announced, not served yet) or RETIRED (no longer supported,
# listed only to tell users it is gone); only AVAILABLE voices can be used. Set
# enabled=false to hide a voice entirely without removing its entry.
tts.voices[0].key=speaker_02
tts.voices[0].name=Speaker 02 V1.0
tts.voices[0].description=Single-speaker voice trained on speaker 02's recordings, the first release.
tts.voices[1].key=speaker_02_v2
tts.voices[1].name=Speaker 02 V2.0
tts.voices[1].description=Single-speaker voice trained on speaker 02's recordings, version 2.0 with longer training for clearer speech.
tts.voices[1].tag=New
# Reserved key: register it in the bridge and switch to AVAILABLE when V2.1 ships.
tts.voices[2].key=speaker_02_v2_1
tts.voices[2].name=Speaker 02 V2.1
tts.voices[2].description=The next version of the speaker 02 voice.
tts.voices[2].status=COMING_SOON
tts.voices[3].key=speaker_03
tts.voices[3].name=Speaker 03
tts.voices[3].description=Multi-speaker voice trained on the Pathnirwana corpus.
tts.voices[4].key=speaker_01
tts.voices[4].name=Speaker 01
tts.voices[4].description=This voice is no longer supported. Please choose another voice.
tts.voices[4].status=RETIRED

# Send every new Gemini answer to the TTS model and store the clip with it.
# Set TTS_AUTO_GENERATE=false to skip this (e.g. when the bridge is not running).
tts.auto-generate=${TTS_AUTO_GENERATE:true}

# Where generated clips are stored
tts.storage.bucket=audios
tts.storage.path-prefix=tts

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
